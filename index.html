<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--surface2:#f6f8fa;--line:#e7ebef;--line2:#d4dae1;
  --ink:#16202c;--ink2:#546170;--ink3:#6b7683;
  --brand:#0f766e;--brand-ink:#fff;--brand-soft:#e3f4f1;--brand-text:#0f6a63;
  --ok:#15803d;--ok-soft:#e4f6ea;--warn:#a16207;--warn-soft:#fdf3d9;
  --bad:#c0342b;--bad-soft:#fdeae8;--info:#1d5fb4;--info-soft:#e6f0fc;
  --r:14px;--r2:10px;--gap:16px;--chart:#0d9488;
  --shadow:0 1px 2px rgba(22,32,44,.05),0 1px 3px rgba(22,32,44,.04);
  --shadow2:0 18px 50px rgba(15,25,35,.2);color-scheme:light;
}
[data-theme=dark]{
  --bg:#0d1317;--surface:#161e24;--surface2:#1c262d;--line:#26323a;--line2:#37454e;
  --ink:#e9eff2;--ink2:#a6b3bc;--ink3:#8a98a2;
  --brand:#2dd4bf;--brand-ink:#04211e;--brand-soft:#123532;--brand-text:#5eead4;
  --ok:#5ad08f;--ok-soft:#14322a;--warn:#e8b75c;--warn-soft:#382c13;
  --bad:#f28b82;--bad-soft:#3d2020;--info:#8ab8f5;--info-soft:#172b45;
  --chart:#11a899;--shadow:none;--shadow2:0 18px 50px rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
a{color:var(--brand-text)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--ink2)}.small{font-size:12.5px}.nowrap{white-space:nowrap}.right{text-align:right}.strong{font-weight:600}.mono{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px}.wrap-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.between{justify-content:space-between}
.stack{display:grid;gap:var(--gap);align-content:start;min-width:0}.mt{margin-top:var(--gap)}.mt2{margin-top:6px}

/* Kerangka */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;min-width:0;text-decoration:none;color:inherit}
.brand img{height:36px;width:auto;max-width:96px;object-fit:contain;flex:none;background:#fff;border-radius:8px;padding:2px 3px}
.brand b{display:block;font-size:14.5px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--ink3);font-size:12px;line-height:1.3}
.nav-h{font-size:12px;font-weight:600;color:var(--ink3);padding:18px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;min-height:40px;padding:8px 10px;border-radius:var(--r2);color:var(--ink2);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:600;padding:0 7px;line-height:19px}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:4px}
.me{display:flex;align-items:center;gap:10px;padding:6px;border-radius:var(--r2);text-decoration:none;color:inherit;min-width:0;flex:1}
.me:hover{background:var(--surface2)}
.me b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:22px 32px 14px}
.top-in{display:flex;align-items:center;gap:10px;width:100%;max-width:1240px;margin:0 auto}
.top h1{font-size:22px;font-weight:650;line-height:1.25;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--ink2);font-size:13px;line-height:1.35;margin-top:1px}
.page-act{display:flex;align-items:center;gap:8px;flex:none}
.content{padding:4px 32px 48px;width:100%;max-width:1304px;margin:0 auto}
.bnav{display:none}

/* Komponen */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:12px 20px}
.card>.hd h2{font-size:15px;font-weight:650;letter-spacing:-.005em}
.card>.bd{padding:4px 20px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:7px 14px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--surface);font-weight:550;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;transition:background .1s,border-color .1s}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08);background:var(--brand)}
.btn.wa{background:#128c4f;border-color:#128c4f;color:#fff}
.btn.wa:hover{background:#0f7a44}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line)}
.btn.icon{padding:0;width:38px}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px;border-radius:9px}.btn.sm.icon{width:32px;padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:550;line-height:18px;white-space:nowrap;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.tag.ok,.tag.warn,.tag.bad,.tag.info,.tag.brand{border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.info{background:var(--info-soft);color:var(--info)}
.tag.brand{background:var(--brand-soft);color:var(--brand-text)}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field>label,.lbl{font-size:13px;font-weight:550;color:var(--ink2)}
.req::after{content:" *";color:var(--bad)}
.hint{font-size:12px;color:var(--ink3);line-height:1.4}
.inp{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surface)}
textarea.inp{min-height:90px;resize:vertical;line-height:1.5}
.inp::placeholder{color:var(--ink3)}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp[readonly]{background:var(--surface2);color:var(--ink2)}
input[type=file].inp{padding:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
/* Tata letak: kolom seimbang yang mengisi lebar halaman */
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:stretch}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);align-items:stretch}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.sticky{position:sticky;top:78px}
.form-act{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.foot-act{display:flex;justify-content:flex-end;gap:8px}
.seg{display:inline-flex;padding:3px;background:var(--line);border-radius:11px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;min-height:32px;padding:4px 13px;border-radius:8px;font-weight:550;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
#orang-seg{flex:none}#orang-seg button{white-space:nowrap}
@media (max-width:380px){#orang-seg button{padding-inline:9px}}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.jenis-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{display:block;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt b{display:block;font-weight:600}.opt small{color:var(--ink2);display:block;line-height:1.35;margin-top:1px}
.opt.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:var(--gap)}
.search{position:relative;flex:1 1 240px;min-width:0}
.search svg{position:absolute;left:12px;top:11px;color:var(--ink3)}
.search input{padding-left:38px}
.toolbar select.inp{width:auto;max-width:100%}

/* Tabel: jadi kartu di layar kecil */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:550;text-align:left;color:var(--ink3);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:20px}
.tbl th:last-child,.tbl td:last-child{padding-right:20px}
.tbl th.right,.tbl td.right{text-align:right}
.th-sort{display:inline-flex;align-items:center;gap:3px;border:0;background:none;padding:3px 5px;margin:-3px -5px;border-radius:6px;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.th-sort svg.i{width:14px;height:14px;opacity:.5}
.th-sort:hover{background:var(--surface2);color:var(--ink)}.th-sort:hover svg.i{opacity:1}
.th-sort.on{color:var(--brand-text);font-weight:650}.th-sort.on svg.i{opacity:1;stroke-width:2.4}
.th-pisah{margin:0 7px;opacity:.6}
.sort-m{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sort-m label{flex:none;font-size:12.5px;color:var(--ink3)}
.sort-m select{flex:1;min-width:0;width:auto}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface2)}
.tbl .who{display:flex;align-items:center;gap:11px;min-width:0}
.tbl td.acts .wrap-row{flex-wrap:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.empty{padding:40px 20px;text-align:center;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.stat{padding:18px 20px;text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px}
a.stat:hover{border-color:var(--line2)}
.stat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand-text)}
.stat .ic.warn{background:var(--warn-soft);color:var(--warn)}.stat .ic.bad{background:var(--bad-soft);color:var(--bad)}.stat .ic.ok{background:var(--ok-soft);color:var(--ok)}
.stat .n{font-size:23px;font-weight:650;line-height:1.2;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .l{color:var(--ink2);font-size:12.5px;line-height:1.35}
.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--gap);align-items:stretch;margin-top:var(--gap)}
.dash>.card{display:flex;flex-direction:column}
.dash>.card>.empty{margin:auto}
.dash.adm{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
/* Pendapatan */
.pend-filter{display:flex;gap:8px;flex-wrap:wrap}
.pend-filter select.inp{width:auto}
.pend-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.4fr);gap:32px;align-items:stretch}
.pend-hero{display:grid;gap:18px;align-content:center}
.pend-hero .n{font-size:27px;font-weight:650;letter-spacing:-.015em;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pend-hero .l{color:var(--ink2);font-size:13px;margin-bottom:3px}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px}
.chart button{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;min-width:0;border-radius:6px;color:var(--ink3)}
.chart .plot{position:relative;height:150px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line2)}
.chart .b{width:min(70%,30px);min-height:2px;background:var(--chart);opacity:.45;border-radius:4px 4px 0 0;transition:opacity .1s}
.chart .b.nol{background:var(--line2);opacity:1;border-radius:0}
.chart button:hover .b:not(.nol),.chart button:focus-visible .b:not(.nol),.chart button.on .b:not(.nol){opacity:1}
.chart .lb{position:absolute;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.chart .tip{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(100% + 2px);background:#16202c;color:#fff;font-size:12px;line-height:1.35;padding:5px 9px;border-radius:7px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .08s}
.chart button:first-child .tip,.chart button:nth-child(2) .tip{left:0;transform:none}
.chart button:last-child .tip,.chart button:nth-last-child(2) .tip{left:auto;right:0;transform:none}
.chart button:hover .tip,.chart button:focus-visible .tip{opacity:1}
.chart .bl{font-size:11.5px;padding:6px 0 2px;text-align:center}
.chart button.on .bl{color:var(--brand-text);font-weight:650}
[data-theme=dark] .chart .tip{background:#e9eff2;color:#16202c}

.ringkas{list-style:none;margin:0;padding:0 20px 12px}
.ringkas li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.alert{display:flex;gap:10px;padding:11px 14px;border-radius:var(--r2);background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.45}
.alert.info{background:var(--info-soft);color:var(--info)}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert a{color:inherit;font-weight:600}
.kv{display:grid;grid-template-columns:128px minmax(0,1fr);gap:9px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;overflow-wrap:anywhere}
.twocol{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--gap);align-items:start}

/* Tahapan */
.steps{list-style:none;margin:0;padding:0}
.steps>li{position:relative;padding:0 0 22px 42px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.steps>li.done::before{background:var(--brand)}
.steps>li:last-child::before{display:none}
.dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:650;background:var(--surface2);color:var(--ink3);border:1px solid var(--line2)}
.dot svg.i{width:15px;height:15px;stroke-width:2.4}
.steps .done .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.steps .now .dot{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-text)}
.steps .t{font-weight:600;line-height:28px}
.steps .wait .t{color:var(--ink3)}
.steps .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.log{list-style:none;padding:0;margin:0;font-size:13px}
.log li{padding:9px 0;border-bottom:1px solid var(--line)}.log li:last-child{border:0}

.jenis-grup{display:grid;gap:7px}
.jenis-bd{container-type:inline-size;gap:12px}
#jenis-grid{display:grid;gap:12px}
#jenis-grid .jenis-grup{gap:6px}
#jenis-grid .lbl{line-height:1.3}
#jenis-grid .jenis-grid{display:flex;flex-wrap:wrap;gap:6px}
#jenis-grid .opt{display:flex;flex:1 1 auto;align-items:center;gap:7px;width:auto;min-height:36px;padding:5px 11px 5px 8px;border-radius:9px;font-size:13.5px}
.jb{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.jb-tumpuk{display:grid;gap:6px;justify-content:stretch}
.jb-tumpuk .jb-isi{min-width:0}
@container (min-width:480px){
  #jenis-grid .jenis-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  #jenis-grid .opt{width:100%}
}
@container (min-width:640px){
  #jenis-grid .jenis-grup,.jb,.jb-tumpuk{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
  #jenis-grid .jenis-grup{align-items:start}
  #jenis-grid .lbl{padding-top:9px}
  .jb-lanjut,.jenis-dipilih{padding-left:162px}
  #orang-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
  #orang-seg button{justify-content:center}
}
#jenis-grid .opt b{font-weight:550;white-space:nowrap}
#jenis-grid .cek{width:16px;height:16px;flex:none;display:grid;place-items:center;border:1.5px solid var(--line2);border-radius:4px;background:var(--surface)}
#jenis-grid .opt.on .cek{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
#jenis-grid .cek svg.i{width:12px;height:12px;stroke-width:3}
.jenis-dipilih{margin:0}.jenis-dipilih b{font-weight:600;color:var(--ink2)}
.cek-jarak{display:flex;align-items:center;gap:9px;min-height:38px;font-weight:550;cursor:pointer}
.cek-jarak input{width:18px;height:18px;margin:0;flex:none;accent-color:var(--brand);cursor:pointer}
@media (max-width:860px){
  #jenis-grid .opt{min-height:38px}
}
.opt{position:relative}
.opt>svg.i{position:absolute;top:10px;right:10px;width:16px;height:16px;color:var(--brand-text);stroke-width:2.4}
/* Pilihan transportasi agen */
.pilih-trans .opt{display:grid;justify-items:center;text-align:center;gap:6px;padding:22px 16px 18px;border-width:1.5px;border-radius:14px;transition:border-color .1s,background .1s}
.pilih-trans .opt b{font-size:15.5px}
.pilih-trans .opt small{margin:0 0 6px}
.pt-ic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.pt-ic svg.i{width:30px;height:30px}
.pilih-trans .ya .pt-ic{background:var(--ok-soft);color:var(--ok)}
.pilih-trans .tidak .pt-ic{background:var(--warn-soft);color:var(--warn)}
.pilih-trans .ya:hover,.pilih-trans .ya:focus-visible{border-color:var(--ok);background:var(--ok-soft)}
.pilih-trans .tidak:hover,.pilih-trans .tidak:focus-visible{border-color:var(--warn);background:var(--warn-soft)}
.pilih-trans .ya:hover .pt-ic,.pilih-trans .tidak:hover .pt-ic{background:var(--surface)}
/* Pilih agen & petugas */
.combo{position:relative}
.combo-list{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:var(--shadow2);max-height:280px;overflow:auto}
.combo-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.combo-list button:hover,.combo-list button:focus{background:var(--surface2)}
.combo-list small{display:block;color:var(--ink3)}
.petugas-list{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:var(--r2);max-height:340px;overflow:auto}
.petugas-list button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:1px solid transparent;border-radius:10px;background:none;padding:8px 10px;cursor:pointer;transition:box-shadow .15s,background .15s,opacity .15s}
.petugas-list button:hover{background:var(--surface2)}
.petugas-list small{display:block;color:var(--ink3);line-height:1.35}
.petugas-list button.dipilih{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand),0 0 12px 1px color-mix(in srgb,var(--chart) 55%,transparent)}
.petugas-list button.dipilih .ava{background:var(--brand);color:var(--brand-ink)}
.petugas-list button.dipilih>svg.i{color:var(--brand-text)}
.petugas-list.penuh button:not(.dipilih){opacity:.55}
.petugas-pilih{padding:0;border:0;border-radius:0;max-height:none;overflow:visible}
.petugas-pilih[hidden]{display:none}
#petugas-list{max-height:calc(340px - var(--terpilih,0)*62px)}
.perm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px;padding:6px 20px}
.perm-row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:54px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch{position:relative;width:40px;height:23px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:background .12s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .12s}
.switch input:checked+i{background:var(--brand)}
.switch input:checked+i::after{transform:translateX(17px)}
.switch input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--gap)}
.hub-h{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 10px}
.hub+.hub-h{margin-top:22px}
.hub a{display:flex;gap:14px;padding:16px 18px;text-decoration:none;color:inherit;align-items:center}
.hub a:hover{border-color:var(--line2)}
.hub .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
.imgbox{display:flex;align-items:center;justify-content:center;background:#fff;border:1px dashed var(--line2);border-radius:var(--r2);padding:10px;min-height:84px}
.imgbox img{max-width:100%;max-height:110px}

/* Modal: lembar bawah di ponsel */
.scrim{position:fixed;inset:0;background:rgba(10,18,24,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:540px;max-height:calc(100dvh - 48px);display:flex;flex-direction:column;box-shadow:var(--shadow2)}
.modal.wide{max-width:900px}
.modal>.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 10px}
.modal>.mh h3{font-size:16px;font-weight:650;letter-spacing:-.005em}
.modal>.mb{padding:6px 20px 18px;overflow:auto;flex:1;overscroll-behavior:contain}
.modal>.mf{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.toasts{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:24px;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:#16202c;color:#fff;padding:11px 15px;border-radius:11px;box-shadow:var(--shadow2);font-size:13.5px}
.toast.bad{background:#a52a21}
[data-theme=dark] .toast:not(.bad){background:#e9eff2;color:#16202c}

/* Login */
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login-side{background:#0c4f4a;color:#eafaf7;padding:48px clamp(32px,6vw,88px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.login-side .lg{height:64px;max-width:200px;object-fit:contain;align-self:flex-start;background:#fff;border-radius:12px;padding:6px 10px}
.login-side h1{font-size:clamp(28px,3vw,38px);font-weight:650;line-height:1.15;letter-spacing:-.015em}
.login-side p{color:#c3e6e0;font-size:15px;line-height:1.55;max-width:44ch}
.login-wk{display:flex;flex-wrap:wrap;gap:7px;list-style:none;margin:0;padding:0}
.login-wk li{padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.1);font-size:12.5px;font-weight:500}
.login-main{display:grid;place-items:center;padding:32px 24px}
.login-form{width:100%;max-width:380px;display:grid;gap:16px}
.login-form h2{font-size:22px;font-weight:650;letter-spacing:-.01em}
.demo{margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}

/* Lembar surat: tetap putih di mode gelap */
.preview{background:#59625f;padding:14px;border-radius:var(--r2)}
.sheet-wrap{margin:0 auto 14px;overflow:hidden}
.sheet-wrap:last-child{margin-bottom:0}
.sheet{width:794px;height:1123px;background:#fff;color:#000;font:14.67px/1.15 Arial,Helvetica,sans-serif;position:relative;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.35);transform-origin:0 0}
.sheet .body{position:absolute;left:113.4px;width:585.9px}
.sheet p{margin:0;position:relative;min-height:1.15em;white-space:pre-wrap}
.sheet .seg-a{position:absolute;top:0;white-space:pre}
.sheet table{border-collapse:collapse;table-layout:fixed}
.sheet td{vertical-align:middle;padding:0 7px}
.sheet .kop{position:absolute;left:41px;top:38px;display:flex;font-family:"Segoe UI",Arial,sans-serif}
.sheet .kop-l{width:348px}.sheet .kop-l img{width:208px;display:block}
.sheet .kop-img{position:absolute;left:41px;top:38px;width:712px}
.kop .k1{color:#12b0a0;font-weight:700;font-size:20px;line-height:22.6px}
.kop .k2{color:#6b7472;font-weight:700;font-size:15.5px;line-height:16.7px}
.kop .k3{color:#6b7472;font-size:15.5px;line-height:20px}
.kop .k4{color:#6b7472;font-size:11.3px;line-height:16px;display:flex;gap:4px;align-items:center}
.kop .k4 img{width:11px;height:11px}.kop .k4 span{min-width:11px}
.sheet .pgno{position:absolute;left:0;right:0;top:49px;text-align:center}
.sheet .foot{position:absolute;font-size:12px;line-height:1.15;border:1px solid #000;padding:1px 10px;text-align:justify}

#kop-preview{max-height:300px;overflow:hidden;border-radius:0 0 13px 13px}
@media (max-width:1180px){
  .dash.adm{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash,.twocol,.split,.cols2{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
}
/* Invoice agen: yang perlu dilakukan di atas, rincian di samping atau dilipat */
.inv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.inv-aksi{grid-column:2;grid-row:1;display:grid;gap:12px;position:sticky;top:76px}
.inv-det{grid-column:1;grid-row:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.inv-det>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:10px 18px;font-weight:650;cursor:pointer;list-style:none}
.inv-det>summary::-webkit-details-marker{display:none}
.inv-det>summary svg.i{transition:transform .12s;transform:rotate(-90deg);color:var(--ink3)}
.inv-det[open]>summary svg.i{transform:rotate(90deg)}
.inv-det[open]>summary{border-bottom:1px solid var(--line)}
.inv-sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.inv-sum-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.inv-total-n{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.inv-pay{margin-top:12px;background:none;border:1.5px solid var(--brand);border-radius:12px;padding:10px 14px;display:grid;gap:8px}
.inv-pay-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inv-pay-row b{display:block;font-size:15.5px;font-weight:650;overflow-wrap:anywhere;line-height:1.3}
.inv-lbl{display:block;font-size:12px;font-weight:550;color:var(--ink3);margin-bottom:2px}
.inv-pay .inv-lbl{color:var(--ink2)}
.inv-sec{padding:14px 18px;border-bottom:1px solid var(--line)}
.inv-sec:last-child{border-bottom:0}
.inv-org{display:flex;gap:12px;align-items:center;min-width:0}
.inv-org img{height:40px;max-width:104px;object-fit:contain;background:#fff;border-radius:8px;padding:3px 5px;flex:none}
.inv-org b{display:block;font-weight:650;line-height:1.3}
.inv-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.inv-tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.inv-tbl th{font-size:12px;font-weight:550;color:var(--ink3);text-align:left;padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
.inv-tbl td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line)}
.inv-tbl th:last-child,.inv-tbl td:last-child{padding-right:0}
.inv-tbl .no{width:26px;color:var(--ink3)}
.inv-tbl .r{text-align:right;white-space:nowrap}
.inv-tbl td.nm{line-height:1.4}
.inv-terbilang{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:12px}
.card-bukti>.bd{gap:10px}
.up-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.up-row .field{min-width:0}
.up-row .inp{min-width:0;max-width:100%;width:100%}
.combo-list button[data-act=pickBank]{font-size:13.5px}
.combo-list button.bank-lain{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--brand-text);background:var(--surface);border-top:1px solid var(--line2);border-bottom:0}
.combo-list button.bank-lain:hover,.combo-list button.bank-lain:focus{background:var(--surface2)}
.up-row input[type=date]{-webkit-appearance:none;appearance:none;padding-right:8px}
/* Kolom kirim foto/file bukti */
.card-bukti{border:2px solid var(--brand)}
.card-bukti>.hd{border-radius:11px 11px 0 0;background:var(--brand-soft);color:var(--brand-text);justify-content:flex-start;margin-bottom:16px}
.card-bukti>.hd h2{color:inherit}
.drop{display:block;position:relative;border:1.5px dashed var(--brand);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .1s,background .1s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--brand);background:var(--brand-soft)}
.drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
#drop-isi{display:flex;align-items:center;gap:12px;pointer-events:none}
.drop-ic{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
#drop-isi img{height:48px;width:48px;object-fit:cover;border-radius:8px;flex:none;background:#fff}
.bukti-thumb{display:block;width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;cursor:pointer;color:inherit;text-align:center}
.bukti-thumb img{display:block;width:100%;max-height:150px;object-fit:contain;background:#fff}
.bukti-thumb .ber{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px 12px;font-size:13px;overflow-wrap:anywhere}
.bukti-view img{display:block;max-width:100%;max-height:60dvh;margin:0 auto;border-radius:10px;background:#fff}
.bukti-view iframe{display:block;width:100%;height:60dvh;border:1px solid var(--line);border-radius:10px;background:#fff}
.bukti-lay{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr);gap:20px;align-items:stretch}
.bukti-lay .bukti-view{display:flex;align-items:center;justify-content:center;min-width:0;padding:8px;background:var(--surface2);border-radius:12px}
.bukti-lay .bukti-view a{display:block;min-width:0;cursor:zoom-in}
.bukti-lay .bukti-view img{max-height:min(calc(100dvh - 230px),560px);margin:0}
.bukti-lay .bukti-view iframe{height:min(calc(100dvh - 230px),560px)}
.bukti-info{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-width:0}
.bukti-info .kv{width:100%;grid-template-columns:112px minmax(0,1fr)}
.bukti-unduh{margin-right:auto}
@media (max-width:860px){
  .bukti-lay{grid-template-columns:minmax(0,1fr);gap:10px}
  .bukti-lay .bukti-view{padding:4px}
  .bukti-lay .bukti-view img{max-height:max(85px,calc(92dvh - 420px))}
  .bukti-lay .bukti-view iframe{height:max(85px,calc(92dvh - 420px))}
  .bukti-info{gap:6px}
  .bukti-info .kv{grid-template-columns:104px minmax(0,1fr);gap:3px 10px;font-size:13px}
  .modal>.mf:has(.bukti-unduh){flex-wrap:nowrap;padding:10px 16px}
  .modal>.mf:has(.bukti-unduh) .btn{padding-inline:12px;white-space:nowrap}
  .modal>.mf:has(.bukti-unduh) .btn:last-child{flex:1}
  .bukti-unduh{margin-right:0}
  .bukti-tutup{display:none}
  .modal>.mb:has(.bukti-lay){padding-bottom:10px}
}
@media (max-width:860px) and (max-height:600px){
  .bukti-lay .bukti-view img{max-height:85px}
  .bukti-lay .bukti-view iframe{height:85px}
}
.scan{max-width:520px;margin:0 auto}
.scan.ada-hasil .scan-view{display:none}
.scan-view{position:relative;height:min(560px,calc(100dvh - 150px));min-height:360px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#1d2a33,#0a1015 72%);color:#fff;box-shadow:var(--shadow2);isolation:isolate}
.scan-view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.scan-petunjuk{position:absolute;top:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:7px 14px;border-radius:99px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:12.5px;font-weight:550;text-align:center;line-height:1.3;z-index:2}
.scan-bingkai{position:absolute;left:50%;top:46%;width:min(66%,270px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:22px;z-index:1}
.scan-on .scan-bingkai{box-shadow:0 0 0 999px rgba(4,10,14,.55)}
.scan-bingkai i{position:absolute;width:42px;height:42px;border:4px solid #2dd4bf;border-radius:4px}
.scan-bingkai i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:22px}
.scan-bingkai i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:22px}
.scan-bingkai i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:22px}
.scan-bingkai i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:22px}
.scan-garis{display:none;position:absolute;left:8%;right:8%;top:10%;height:3px;border-radius:3px;background:#2dd4bf;box-shadow:0 0 14px 3px rgba(45,212,191,.65)}
.scan-on .scan-garis{display:block}
.scan-kosong{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(58%,230px);display:grid;justify-items:center;gap:4px;text-align:center;z-index:1}
.scan-kosong svg.i{width:40px;height:40px;margin-bottom:6px;opacity:.75}.scan-kosong b{font-weight:600}.scan-kosong span{font-size:12.5px;line-height:1.35;color:rgba(255,255,255,.72)}
.scan-on .scan-kosong{display:none}
.scan-aksi{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;z-index:2}
.btn.scan-tbl{min-height:48px;padding-inline:8px;border-radius:16px;color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn.scan-tbl:hover,.btn.scan-tbl:not(.pri,.wa,.danger,[disabled]):active{background:rgba(255,255,255,.24)}
.scan-hasil{display:grid;justify-items:center;gap:6px;padding:26px 20px 20px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);text-align:center}
.scan-hasil h2{font-size:19px;font-weight:650;letter-spacing:-.01em}
.scan-tanda{width:60px;height:60px;display:grid;place-items:center;border-radius:50%;margin-bottom:6px}.scan-tanda svg.i{width:30px;height:30px;stroke-width:2.4}
.sah .scan-tanda{background:var(--ok-soft);color:var(--ok)}.tolak .scan-tanda{background:var(--bad-soft);color:var(--bad)}
.scan-hasil .kv{width:100%;margin:12px 0 10px;padding-top:14px;border-top:1px solid var(--line);text-align:left}
@keyframes scanGaris{from{top:10%}to{top:88%}}
@media (prefers-reduced-motion:no-preference){.scan-on .scan-garis{animation:scanGaris 2s ease-in-out infinite alternate}}
@media (max-width:860px){.content:has(.scan){padding-bottom:12px}.scan{max-width:none}.scan-view{height:calc(100dvh - 186px - env(safe-area-inset-bottom));min-height:340px;max-height:none}}
.biaya-baris{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
@media (max-width:860px){
  .inv{grid-template-columns:minmax(0,1fr);gap:10px}
  .inv-aksi,.inv-det{grid-column:1;grid-row:auto;position:static}
  .inv-sum{padding:12px 14px}
  .inv-total-n{font-size:26px;margin:4px 0 2px}
  .inv-pay{margin-top:8px}
  .inv-sec{padding:12px 14px}
  .inv-det>summary{padding:10px 14px}
  .inv-meta{gap:12px}
  .card-bukti>.hd{margin-bottom:10px;min-height:44px}
  .up-row .f-bank,.up-row .f-tgl{grid-column:1/-1}
  .card-bukti .field>label{font-size:12.5px}
  .inv-tbl thead{display:none}
  .inv-tbl,.inv-tbl tbody,.inv-tbl tr,.inv-tbl td{display:block;width:100%}
  .inv-tbl tr{padding:8px 0;border-bottom:1px solid var(--line)}
  .inv-tbl tr:last-child{border-bottom:0}
  .inv-tbl td{border:0;padding:1px 0}
  .inv-tbl .no,.inv-tbl td.r.nol{display:none}
  .inv-tbl td.r{display:flex;justify-content:space-between;gap:12px;white-space:normal}
  .inv-tbl td.r::before{content:attr(data-l);color:var(--ink3);font-size:12.5px;font-weight:400}
}
/* Ponsel: pola aplikasi */

  .content{padding:12px 12px 22px}

  .bnav a.fab-qr span{display:inline}
  .bnav a.fab-qr svg{width:56px;height:56px;padding:14px;margin-top:-30px;border-radius:20px;box-shadow:0 0 0 4px var(--surface),0 8px 18px color-mix(in srgb,var(--brand) 40%,transparent);stroke-width:2}

  .fab-buat svg{width:24px;height:24px}
  .content{padding-bottom:64px}
  .bnav .cnt{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-weight:600;padding:0 5px;line-height:15px}
  .grid2,.grid3,.cols3,.perm-grid,.pend-grid{grid-template-columns:minmax(0,1fr)}
  .pend-grid{gap:18px}.pend-hero{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pend-hero .n{font-size:20px}
  .pend-filter{width:100%}.pend-filter select.inp{flex:1;min-width:0}
  .chart .bl{font-size:10px}.chart .lb{font-size:10.5px}
  
  .span2{grid-column:auto}
  .jenis-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}

  .inp,.btn{min-height:44px}.btn.sm{min-height:36px}.btn.sm.icon{width:36px}.btn.icon{width:44px}
  input.inp,select.inp,textarea.inp{font-size:16px} /* cegah zoom otomatis iOS */
  .kv{grid-template-columns:112px minmax(0,1fr)}
  .seg{display:flex}.seg button{flex:1 1 0;min-width:0;padding:4px 6px;white-space:normal;line-height:1.2;min-height:40px}

  .login-side{padding:calc(24px + env(safe-area-inset-top)) 20px 24px;gap:12px}

  .login-main{padding:24px 20px;place-items:start center}

@media (min-width:861px){.mob{display:none!important}}
:where(.th-sort,.btn,.opt,.seg button,.nav a,.bnav a,a.stat,.petugas-list button,.combo-list button,.bukti-thumb,.drop){position:relative;touch-action:manipulation}
.btn:not(.pri,.wa,.danger,[disabled]):active{background:var(--line)}
.btn.pri:not([disabled]):active,.btn.wa:not([disabled]):active{filter:brightness(.88)}
.btn.danger:not([disabled]):active{background:var(--bad-soft)}
.riak::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;pointer-events:none;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .th-sort,.btn,.seg button,.nav a,.bnav a,.opt,a.stat,.petugas-list button,.combo-list button,.bukti-thumb,.drop{transition:transform .09s ease-out,filter .09s,background-color .1s,border-color .1s,box-shadow .12s}
  .th-sort:active,.btn:not([disabled]):active,.seg button:active,.nav a:active,.bnav a:active,.combo-list button:active,.petugas-list button:active{transform:scale(.96)}
  .opt:active,.pilih-trans .opt:active,a.stat:active,.bukti-thumb:active,.drop:active{transform:scale(.98)}
  .riak::after{animation:riak .45s ease-out forwards}
  @keyframes riak{from{clip-path:circle(0 at var(--rx) var(--ry));opacity:.26}to{clip-path:circle(150% at var(--rx) var(--ry));opacity:0}}
}
@media (prefers-reduced-motion:no-preference){.scrim{animation:f .12s ease-out}@keyframes f{from{opacity:0}}}
@media (max-width:860px){
  /* Pencarian dan filter */
  .toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
  .toolbar .search,.toolbar .seg{grid-column:1/-1;width:100%}
  .toolbar select.inp{width:100%;min-width:0}
  .toolbar>select.inp:last-child:nth-child(2){grid-column:1/-1}
  /* Segmen sama lebar dan tidak terlipat */
  .seg button{white-space:nowrap;font-size:13.5px}
  /* Baris tabel menjadi kartu dua kolom */
  .tbl tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;padding:12px 14px;width:auto}
  .tbl td,.tbl td:first-child,.tbl td:last-child{width:auto;min-width:0;padding:0}
  .tbl td.hd-cell{grid-column:1/-1;padding-bottom:2px}
  .tbl td.acts{grid-column:1/-1;padding-top:0}
  .tbl td.acts.right{grid-column:2;justify-self:end;align-self:end}
  .tbl td[data-l]{display:block}
  .tbl td[data-l]::before{display:block;font-size:11.5px;line-height:1.5}
  .tbl td[data-l]>*{display:block;text-align:left}
  .tbl td.acts .wrap-row .btn{flex:1 1 auto}
  #list.card{background:none;border:0;box-shadow:none;overflow:visible}
  #list .tbl tbody{display:grid;gap:10px}
  #list .tbl tr,#list .tbl tbody tr:last-child{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  #list .sort-m{padding:0;border:0;margin-bottom:10px}
  #list .pager{padding:12px 2px 0}
  #list>.empty{background:var(--surface);border:1px solid var(--line);border-radius:16px}
  /* Beranda */
  .stats{gap:10px}
  .stat{gap:8px;padding:12px 14px}.stat .ic{width:36px;height:36px;border-radius:11px}
  .chart .plot{height:92px}
  .pend-grid{gap:14px}
  /* Alur surat */
  .steps>li{padding-bottom:18px}
  .steps .acts .btn{flex:1 1 auto}
  /* Menu pengaturan seperti daftar pada aplikasi */
  .hub{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .hub+.hub-h{margin-top:18px}
  .hub a.card{border:0;border-radius:0;box-shadow:none;background:none;padding:12px 14px;gap:12px;position:relative}
  .hub a.card+a.card{border-top:1px solid var(--line)}
  .hub a.card::after{content:"";width:8px;height:8px;flex:none;border-top:2px solid var(--ink3);border-right:2px solid var(--ink3);transform:rotate(45deg);margin-right:3px}
  .hub .ic{width:38px;height:38px}
  /* Tombol form penuh */
  .foot-act{display:grid;justify-content:stretch}.foot-act .btn{width:100%}
  /* Login */
  .demo .wrap-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .demo .btn{width:100%;min-height:44px;white-space:normal;line-height:1.2;padding:6px 8px}
}
@media (max-width:440px){.seg button svg.i{display:none}}
@media (max-width:380px){.seg button{font-size:12.5px;padding-inline:3px}.top-in{gap:6px}.page-act{gap:4px}.top .btn.icon,.page-act .btn{width:38px;min-height:38px;padding:0}.top h1{font-size:15.5px;white-space:normal;line-height:1.2}}
</style>

function mergeRec(b,l,r){
  const out={};
  for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
    if(k==='log'&&Array.isArray(l[k])&&Array.isArray(r[k])){
      const m=new Map();[...l[k],...r[k]].forEach(x=>m.set(x.t+'|'+x.msg,x));
      out[k]=[...m.values()].sort((x,y)=>y.t-x.t);continue;
    }
    const v=JSON.stringify(l[k])!==JSON.stringify(b[k])?l[k]:r[k];
    if(v!==undefined)out[k]=v;
  }
  return out;
}
function mergeList(b,l,r){

  l.forEach(x=>{if(!rm.has(x.id)&&!bm.has(x.id))out.push(x);});

}

function doFlush(force){

    if(t.fileId)migrasi.berkas.push(t.fileId);
    if(!t.nomor)t.nomor=nomorInvoice(d.settings);
    ['terbit','fileId','uangHarian','hotel','penandatangan'].forEach(k=>delete t[k]);});
  // Satu surat bisa memuat beberapa jenis; surat SSCEC lama memang sudah mencakup P3K

  if(!d.settings.bank)d.settings.bank=[...BANK_AWAL];

  if(d.settings.tarifLuar===undefined)d.settings.tarifLuar=TARIF_LUAR_AWAL;
  d.st.forEach(s=>{if(!s.jarak)s.jarak='dekat';});

function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const head=text.split(/\r?\n/,1)[0];const sep=(head.match(/;/g)||[]).length>(head.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],c='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(c);c='';}
    else if(ch==='\n'){row.push(c.replace(/\r$/,''));rows.push(row);row=[];c='';}
    else c+=ch;}
  if(c||row.length){row.push(c);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()));
}

function fileToImage(file,maxW=1000){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const w0=im.naturalWidth||600,h0=im.naturalHeight||200,k=Math.min(1,maxW/w0),w=Math.round(w0*k),h=Math.round(h0*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);res({url:c.toDataURL('image/png'),w,h});};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Berkas bukan gambar yang valid'));};im.src=u;});}

function blokPetugasInline(s){
  const out=[];

  s.petugas.forEach((id,i)=>{const u=petugasOf(id)||{};
    const rows=[['nama',u.nama],['NIP',u.nip],['pangkat/golongan',u.pangkat],['jabatan',u.jabatan],['unit kerja','Balai Kekarantinaan Kesehatan Kelas I Tarakan']];
    rows.forEach(([k,v],r)=>out.push(P((r===0&&banyak?`${i+1}.\t`:'\t')+`${k}\t:\t${v||''}`,{left:3800,hanging:3113,tabs:[1077,3528,3800],after:r===4?240:0})));
  });
  return out;
}

  if(tanggal)out.push(P(tglID(s.tglST),{left:x,before:gapAtas}));
  out.push(P(pj.j1,{left:x,before:tanggal?0:gapAtas,keep:1}),P(pj.j2,{left:x,keep:1}));
  out.push(P(TAG_TTD,{left:L.ttd,before:gapTtd,keep:1}));

function untukUmum(s,L){
  const pilih=urutJenis(s.jenis),huruf='abcdefghijklmnopqrstuvwxyz';
  const A=(n,t)=>P(`${n}.\t${t}`,{left:L.aTxt,hanging:L.aTxt-L.aNum,tabs:[L.aTxt],align:'both',right:L.untukR});
  const K=(n,k,v)=>P(`${n})\t${k}\t:\t${v}`,{left:L.iTxt,hanging:L.iTxt-L.iNum,tabs:[L.iTxt,L.iColon,L.iVal]});
  const N=(n,t)=>P(`${n}.\t${t}`,{left:L.txt,hanging:L.txt-L.num,tabs:[L.txt],align:'both',right:L.untukR});
  const buka=[{t:'Untuk\t:\t1.\tMelaksanakan pengawasan dan pemeriksaan dalam rangka '}];
  pilih.forEach((k,i)=>{
    JENIS[k].frasa.forEach((t,j)=>buka.push(j%2?I(t):{t}));
    if(i<pilih.length-1)buka.push({t:i===pilih.length-2?' dan ':', '});
  });

  const nomor=[...new Set(pilih.flatMap(k=>JENIS[k].item))].sort((a,b)=>a-b);
  return[
    P(buka,{left:L.txt,hanging:L.txt-L.lab,tabs:[L.colon,L.num,L.txt],align:'both',right:L.untukR}),
    ...nomor.map((n,i)=>A(huruf[i],ITEM_JENIS[n])),
    A(huruf[nomor.length],'Adapun kapal yang akan dilakukan pengawasan dan pemeriksaan adalah sebagai berikut :'),
    K(1,'Nama Kapal',namaKapal(s)),K(2,'Posisi Kapal',s.posisi),K(3,'Tanggal',tglID(s.tanggal)),
    P('Pemeriksaan',{left:L.iTxt}),

}

const DEMIKIAN='Demikian surat tugas ini dibuat untuk dilaksanakan dengan baik dan penuh tanggung jawab.';
const barisTeks=l=>l.reduce((n,b)=>n+Math.ceil(b.runs.map(r=>r.t).join('').length/58),0);
const BARIS_SATU_HALAMAN=25;
function docST(s){
  const k=kunciJenis(s.jenis),isCop=k==='cop',isPen=k==='penumpang';
  const L=isCop?LAYOUT.cop:isPen?LAYOUT.pelni:LAYOUT.sscec,inline=s.petugas.length<3;
  const untuk=isCop?untukCOP(s,L):isPen?untukPELNI(s,L):k==='sscec+p3k'?untukSSCEC(s,L):untukUmum(s,L);
  const p1=[...nomorKepala(),P(teksIntro(s,L),{first:720,align:'both',after:inline?240:0})];
  if(inline){
    p1.push(...blokPetugasInline(s),...untuk);
    // Satu petugas: tanda tangan ikut di halaman pertama selama masih muat
    const nBaris=barisTeks([p1[p1.length-1-blokPetugasInline(s).length-untuk.length],...untuk]);
    if(!isPen&&s.petugas.length===1&&nBaris<=BARIS_SATU_HALAMAN){
      p1.push(P(DEMIKIAN,{first:720,align:'both',before:nBaris>21?120:200}),...blokTtd(s,{...L,sign:4320,ttd:4770},nBaris>21?{tanggal:true,namaTag:true,gapAtas:60,gapTtd:360,gapNama:520}:{tanggal:true,namaTag:true,gapAtas:60,gapTtd:910,gapNama:765}));
      return{kop:true,pages:[p1],foot:[0]};
    }
    if(isPen){ // tidak ada contoh; muat di satu halaman
      p1.push(P(DEMIKIAN,{first:720,align:'both',before:200}),...blokTtd(s,{...L,sign:4708},{tanggal:true,namaTag:true}));
      return{kop:true,pages:[p1],foot:[0]};
    }
    const p2=[P('',{after:560}),P(DEMIKIAN,{first:720,align:'both'}),...blokTtd(s,{...L,sign:4320,ttd:4770},{tanggal:true,namaTag:true,gapAtas:60,gapTtd:910,gapNama:765})];
    return{kop:true,pages:[p1,p2],foot:[1]};
  }
  // Kombinasi di luar contoh teksnya lebih panjang, jadi jaraknya dirapatkan agar tetap 1 halaman
  const rapat=!isCop&&!isPen;
  p1.push(P('(nama, NIP, pangkat/golongan, dan jabatan terlampir)',{align:'center',before:rapat?240:720,after:isPen?480:rapat?200:320}),...untuk);
  const penutup=[P(DEMIKIAN,{first:720,align:'both',before:isPen?280:200}),...blokTtd(s,L,rapat?{tanggal:true,gapAtas:280,gapTtd:360,gapNama:520}:{tanggal:true})];
  // Surat kombinasi: Demikian sampai nama pejabat berpindah halaman sebagai satu blok
  const ttd=rapat?penutup.map((b,i)=>i<penutup.length-1?{...b,keep:1}:b):penutup;
  // Kombinasi sangat panjang: tanda tangan pindah ke halaman sendiri agar tidak terpotong
  const baris=barisTeks(untuk);
  if(baris>26)return{kop:true,pages:[p1,[P('',{after:240}),...ttd],blokLampiran(s,L)],foot:[0],pageNum:true};
  p1.push(...ttd);
  return{kop:true,pages:[p1,blokLampiran(s,L)],foot:[0],pageNum:true};
}

function runsHtml(runs){return runs.map(r=>{let h=esc(r.t);if(r.b)h=`<b>${h}</b>`;if(r.i)h=`<i>${h}</i>`;return h;}).join('');}
function splitTabs(runs){const segs=[[]];runs.forEach(r=>{r.t.split('\t').forEach((x,i)=>{if(i)segs.push([]);if(x)segs[segs.length-1].push({...r,t:x});});});return segs;}
let lebarIsi=8788;
function pHtml(p){
  const left=p.left||0,hang=p.hanging||0,st=[`margin-left:${tw(left)}`];
  if(p.right)st.push(`margin-right:${tw(p.right)}`);
  if(p.before)st.push(`margin-top:${tw(p.before)}`);
  if(p.after)st.push(`margin-bottom:${tw(p.after)}`);
  if(p.align==='center')st.push('text-align:center');
  if(p.align==='both')st.push('text-align:justify');
  if(p.first)st.push(`text-indent:${tw(p.first)}`);
  if(p.line)st.push(`line-height:${1.15*p.line/240}`);
  const segs=splitTabs(p.runs);
  if(segs.length===1)return `<p style="${st.join(';')}">${runsHtml(segs[0])}</p>`;
  const pos=[left-hang,...(p.tabs||[]).map(t=>typeof t==='object'?t:+t)];
  let html='',flow='';
  segs.forEach((s,i)=>{
    const x=pos[i];
    if(i===segs.length-1&&+x===left&&typeof x!=='object'){flow=runsHtml(s);return;}
    if(typeof x==='object'){html+=`<span class="seg-a" style="right:${tw(lebarIsi-x.right)}">${runsHtml(s)}</span>`;return;}
    html+=`<span class="seg-a" style="left:${tw((x||0)-left)}">${runsHtml(s)}</span>`;
  });
  return `<p style="${st.join(';')}">${html}${flow||'&nbsp;'}</p>`;
}

}

    ${k==='tolak'?`<div class="alert bad">${ic('alert')}<span>Bukti sebelumnya ditolak: ${esc(b.alasan||'')}. Silakan kirim ulang.</span></div>`:''}
    <label class="drop" id="drop"><input type="file" name="file" accept="image/*,.pdf" data-change="buktiPilih" aria-label="Foto atau file bukti transfer"><span id="drop-isi">${isiDrop()}</span></label>

      ${field('No. rekening pengirim','norek','',{req:1,mode:'numeric',ph:'Nomor rekening',ac:'off'})}
      ${field('Nama penyetor','nama','',{req:1,ph:'Sesuai rekening'})}
      ${field('Tanggal transfer','tgl',today(),{req:1,type:'date',cls:'f-tgl'})}

  const terkirim=(k==='validasi'||k==='valid')?`<div class="card"><div class="hd"><h2>Bukti Transfer</h2><span class="tag ${k==='valid'?'ok':'warn'}">${k==='valid'?'Tervalidasi':'Sedang divalidasi'}</span></div><div class="bd stack" style="gap:10px">

    <dl class="kv small">${baisBukti(b)}</dl></div></div>`:'';
  return `<div class="inv"><div class="inv-aksi">${I.ringkas}${form}${terkirim}</div>${I.rincian}</div>`;

const refresh=()=>{save();route();};
const actions={
  closeModal,
  salinTautan(el){salinKe(appLink('t/'+findST(el.dataset.id).token),'Tautan agen disalin');},
  salinTeks(el){salinKe(el.dataset.t,'Disalin');},
  async unduhFile(el){const f=await store.get('files',el.dataset.file);if(f)downloadBlob(f.blob,f.name);else toast('Berkas tidak ditemukan','bad');},
  async lihatBukti(el){

    openModal({title:`Bukti Transfer - ${s.kapal}`,wide:true,body:`<div class="bukti-lay"><div class="bukti-view">${isi}</div><div class="bukti-info">${stageTag(s)}<dl class="kv"><dt>Agen</dt><dd>${esc(namaAgenST(s))}</dd>${baisBukti(b)}<dt>Jumlah tagihan</dt><dd class="strong mono">Rp ${rp(totalTagihan(s.tagihan))}</dd>${b.status==='ditolak'?`<dt>Alasan tolak</dt><dd>${esc(b.alasan)}</dd>`:''}${b.validBy?`<dt>Divalidasi</dt><dd>${esc(b.validBy)}, ${waktu(b.validAt)}</dd>`:''}</dl></div></div>`,

  dashPilih(el){periodeDash().m=+el.dataset.m;rerender();},
  bankLain(){const i=$('#f_bank');i.dataset.lain='1';i.placeholder='Ketik nama bank Anda';$('#bank-list').hidden=true;i.focus();},
  pickBank(el){const i=$('#f_bank');i.value=el.dataset.n;$('#bank-list').hidden=true;const n=document.querySelector('[name=norek]');if(n&&innerWidth>860)n.focus();},

  logout(){sessionStorage.removeItem('rpl.session');ME=null;location.hash='';route();},

  setTheme(el){applyTheme(el.dataset.v);route();},
  previewST(el){const s=findST(el.dataset.id);showPreview('Pratinjau Surat Tugas',docST(s),'st',s.id);},
  dlST(el){downloadST(findST(el.dataset.id));},
  dlNominatif(el){const s=findST(el.dataset.id);if(s&&s.tagihan&&bolehLihat(s))unduhNominatif(s);},
  previewNominatif(el){const s=findST(el.dataset.id);if(!s||!s.tagihan||!bolehLihat(s))return;
    actions._previewDl=()=>unduhNominatif(s);
    openModal({title:`Daftar Nominatif - ${s.kapal}`,wide:true,body:`<div class="bukti-view"><iframe src="${urlBerkas(pdfNominatif(s))}" title="Daftar nominatif"></iframe></div>`,foot:`<button class="btn" data-act="closeModal">Tutup</button><button class="btn pri" data-act="_previewDl">${ic('down')} Unduh PDF</button>`});},
  qrUlang(){const h=$('#qr-hasil');h.hidden=true;h.innerHTML='';h.closest('.scan').classList.remove('ada-hasil');kameraOtomatis();},
  async qrKamera(el){if(kamera)return hentikanKamera();
    try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('#qr-video');if(!v||kamera){stream.getTracks().forEach(t=>t.stop());return;}kamera={stream,aktif:true};labelKamera(true);v.srcObject=stream;await v.play();
      const kan=document.createElement('canvas'),x=kan.getContext('2d',{willReadFrequently:true}),baca=jsqr();
      const putar=()=>{if(!kamera||!kamera.aktif)return;if(v.videoWidth){kan.width=v.videoWidth;kan.height=v.videoHeight;x.drawImage(v,0,0);const r=baca(x.getImageData(0,0,kan.width,kan.height).data,kan.width,kan.height);if(r){tampilHasilQr(r);hentikanKamera();return;}}setTimeout(putar,200);};putar();
    }catch(e){hentikanKamera();if(!el||!el.diam)toast('Kamera tidak bisa dibuka. Gunakan pilihan foto QR.','bad');}},
  async dlPernyataan(el){const s=findST(el.dataset.id);if(!bolehPernyataan(s))return;
    try{downloadBlob(await pdfPernyataan(s),`SURAT PERNYATAAN ${s.kapal}.pdf`.replace(/[\\/:*?"<>|]/g,'-'));toast('Surat pernyataan diunduh');}catch(e){toast('Surat pernyataan gagal dibuat','bad');}},
  async previewPernyataan(el){const s=findST(el.dataset.id);if(!bolehPernyataan(s))return;

    openModal({title:`Surat Pernyataan - ${s.kapal}`,wide:true,body:`<div class="bukti-view"><iframe src="${urlBerkas(blob)}" title="Surat pernyataan"></iframe></div>`,foot:`<button class="btn" data-act="closeModal">Tutup</button><button class="btn pri" data-act="_previewDl">${ic('down')} Unduh PDF</button>`});},
  openFile(el){openFile(el.dataset.file);},
  sort(el){const{t,c:k}=el.dataset,s=sortAktif(t),awal=SORT_KOL[t][k][2]||1;
    if(!s||s.c!==k)sortPilih[t]={c:k,d:awal};else if(s.d===awal)sortPilih[t]={c:k,d:-awal};else delete sortPilih[t];
    sortSimpan(t);document.querySelector(`.th-sort[data-t="${t}"][data-c="${k}"]`)?.focus({preventScroll:true});},
  sortArah(el){const t=el.dataset.t,s=sortAktif(t);if(s){sortPilih[t]={c:s.c,d:-s.d};sortSimpan(t);}},
  suratPage(el){ui.surat.page=+el.dataset.p;renderSuratList();},
  setoranPage(el){ui.setoran.page=+el.dataset.p;renderSetoranList();},

  setJenis(el){const k=el.dataset.k,ada=formJenis.includes(k);
    formJenis=urutJenis(ada?formJenis.filter(x=>x!==k):[...formJenis,k]);
    const bawaan=CONTOH[kunciJenis(formJenis)];if(bawaan&&!ui.pick.length)formOrang=bawaan;
    const y=scrollY;$('#jenis-grid').innerHTML=jenisButtons();$('#orang-seg').innerHTML=orangButtons();$('#format-hint').textContent=formatHint();$('#jenis-count').textContent=formJenis.length?`${formJenis.length} dipilih`:'Belum dipilih';
    // Hal hanya diganti selama petugas belum mengubahnya sendiri
    const hal=$('form[data-form=surat]').elements.hal;if(!hal.value.trim()||hal.value===halOtomatis)hal.value=halDari(formJenis);halOtomatis=halDari(formJenis);

  setOrang(el){formOrang=+el.dataset.n;$('#orang-seg').innerHTML=orangButtons();$('#format-hint').textContent=formatHint();ui.pick=ui.pick.slice(0,formOrang);renderPicker();},
  pick(el){if(ui.pick.length>=formOrang)return toast(`Maksimal ${formOrang} petugas untuk format ini`,'bad');ui.pick.push(el.dataset.id);const q=$('[data-input=petugasQ]');if(q)q.value='';renderPicker();},
  unpick(el){ui.pick=ui.pick.filter(x=>x!==el.dataset.id);renderPicker();},
  pickAgen(el){const a=agenOf(el.dataset.id),f=$('form[data-form=surat]');f.elements.agenId.value=a.id;$('#f_agenQ').value=a.nama;f.elements.agenSurat.value=a.nama;$('#agen-list').hidden=true;
    if(!waNumber(a.telp))toast('Nomor agen ini tidak dikenali sebagai WhatsApp','bad');},
  catatST(el){const s=findST(el.dataset.id);
    openModal({title:'Unggah hasil TTE Srikandi',form:'catatST',body:`<input type="hidden" name="id" value="${s.id}"><div class="stack">${field('Nomor surat tugas','nomor',s.nomor,{req:1,ph:'Nomor dari Srikandi'})}${field('Surat tugas bertanda tangan (opsional)','file','',{type:'file',accept:'.pdf,.jpg,.jpeg,.png',hint:'PDF, JPG, atau PNG, maksimal 5 MB.'})}</div>`,foot:`<button type="button" class="btn" data-act="closeModal">Batal</button><button class="btn pri">Simpan</button>`});},

    openModal({title:koreksi?'Koreksi jawaban agen':'Catat jawaban agen',body:`<div class="stack"><p class="muted">${koreksi?`Jawaban saat ini: ${jemputTeks(s)}. Ubah hanya bila ada kekeliruan.`:'Gunakan hanya jika agen menjawab melalui telepon atau surat.'}</p><button class="opt" data-act="_jm" data-v="ya"><b>Disediakan agen</b><small>Tanpa tagihan (Rp 0), tampil "Dijemput Agen".</small></button><button class="opt" data-act="_jm" data-v="tidak"><b>Tidak disediakan</b><small>Lanjut generate surat tagihan.</small></button></div>`});},
  agenJemput(el){const s=stDariTautan();if(!s||s.jemput)return;const v=el.dataset.v;
    confirmBox('Konfirmasi transportasi',v==='ya'?'Transportasi petugas disediakan oleh agen. Jawaban ini tidak dapat diubah sendiri setelah dikirim.':'Transportasi tidak disediakan, biaya akan ditagihkan. Jawaban ini tidak dapat diubah sendiri setelah dikirim.',()=>{setJemput(s,v,'agen',v==='ya'?'Agen menyediakan transportasi':'Agen tidak menyediakan transportasi',namaAgenST(s));refresh();},'Kirim jawaban');},
  genTagihan(el){const s=findST(el.dataset.id),R=DB.settings.rekening;

      ${s.petugas.map(id=>{const u=petugasOf(id)||{};return `<div class="biaya-baris"><div class="strong">${esc(u.nama||'')}<div class="small muted" style="font-weight:400">${esc(u.pangkat||'')}${u.nip?' | NIP '+esc(u.nip):''}</div></div><div class="grid3">${field('Transport Lokal','tr_'+id,nilai(id,'transport'),{req:1,type:'number',min:0,mode:'numeric',ro:j==='jauh'})}${field('Penginapan','pg_'+id,nilai(id,'penginapan'),{type:'number',min:0,mode:'numeric'})}${field('Uang Harian','uh_'+id,nilai(id,'uangHarian'),{type:'number',min:0,mode:'numeric'})}</div></div>`;}).join('')}</div>
      <p class="hint">Tagihan langsung terbit tanpa pengesahan. Setelah disimpan, kirim WA ke agen dan unduh daftar nominatif.</p></div>`,

  hapusST(el){const s=findST(el.dataset.id);confirmBox('Hapus surat tugas',`Surat tugas ${namaKapal(s)} akan dihapus permanen.`,async()=>{for(const f of [s.fileST,s.bayar&&s.bayar.fileId])if(f)await store.del('files',f);DB.st=DB.st.filter(x=>x!==s);save();location.hash='#/surat';toast('Surat tugas dihapus');},'Hapus',true);},

    if(act.disabled)return;
    const fn=actions[act.dataset.act];
    if(fn){const kunci=[...act.attributes].filter(a=>a.name.startsWith('data-')).map(a=>`[${a.name}="${CSS.escape(a.value)}"]`).join('');const keepDefault=fn(act,e);if(!act.isConnected&&riakPos){const b=document.querySelector(kunci);if(b&&b.matches(TEKAN))riak(b,riakPos);}riakPos=null;if(keepDefault!==true)e.preventDefault();e.stopPropagation();return;}
  }
  const go=e.target.closest('[data-go]');if(go&&!e.target.closest('a,button,input,label')){location.hash='#/'+go.dataset.go;return;}
  if(!e.target.closest('.combo'))document.querySelectorAll('.combo-list').forEach(b=>b.hidden=true);
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.busy)return;f.dataset.busy=1;
  try{await forms[f.dataset.form](new FormData(f),f);}catch(err){toast('Terjadi kesalahan: '+err.message,'bad');}
  delete f.dataset.busy;
});
for(const ev of ['dragenter','dragover'])document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('.drop');if(!d)return;e.preventDefault();d.classList.remove('over');const i=d.querySelector('input');i.files=e.dataTransfer.files;i.dispatchEvent(new Event('change',{bubbles:true}));});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.input;if(k&&inputs[k])inputs[k](e);});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.change;if(k&&changes[k]){changes[k](e);}});
for(const ev of ['focusin','focusout','click'])document.addEventListener(ev,e=>{if(e.target.dataset&&e.target.dataset.input==='bankCombo')inputs.bankCombo(e);});
addEventListener('hashchange',route);
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('inv-det'))ui.invBuka=e.target.open;},true);
/* Perubahan dari tab lain masuk tanpa muat ulang: lewat BroadcastChannel, saat tab difokuskan, dan pemeriksaan berkala */
let needRender=false,syncing=false;
const sibuk=()=>modalOpen||!!kamera||!!$('#app form[data-form]')||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
function rerender(){const y=scrollY;route();scrollTo(0,y);}
function umumkan(lama,baru){
  if(!ME)return;
  const dulu=new Map(lama.st.map(s=>[s.id,s]));
  baru.st.forEach(s=>{const o=dulu.get(s.id);if(!o||!bolehLihat(s))return;
    if(s.jemput&&!o.jemput)toast(`${s.kapal}: ${jemputTeks(s)}`);
    if(stage(s)==='validasi'&&stage(o)!=='validasi')toast(`${s.kapal}: agen mengunggah bukti bayar`);
  });
}
window.afterMerge=()=>{loadSession();if(sibuk())needRender=true;else rerender();};
async function syncNow(){
  if(!store.db||saveT||modalOpen||syncing)return;
  syncing=true;
  try{
    const rev=await store.get('kv','rev');
    if(rev!==undefined&&rev!==DB.rev){
      const baru=await store.get('kv','state');
      if(baru&&!saveT&&!modalOpen){const lama=DB;DB=baru;BASE=JSON.stringify(DB);loadSession();umumkan(lama,DB);needRender=true;}
    }
    if(needRender&&!sibuk()){needRender=false;rerender();}
  }finally{syncing=false;}
}
if(chan)chan.onmessage=syncNow;
addEventListener('focus',syncNow);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow();});
addEventListener('pagehide',()=>{if(saveT)flush();});
(async function boot(){
  await store.open();
  DB=await store.get('kv','state');
  if(!DB||!DB.settings){DB=seedState();await flush(true);}
  else if(migrasi(DB)){await flush(true);await bersihMigrasi();}
  BASE=JSON.stringify(DB);
  loadSession();route();
  setInterval(syncNow,2000);
  if(!store.db)toast('Penyimpanan browser tidak tersedia. Data hilang saat halaman ditutup.','bad');
})();
</script>
</body>
