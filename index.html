<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--surface2:#f6f8fa;--line:#e7ebef;--line2:#d4dae1;
  --ink:#16202c;--ink2:#546170;--ink3:#6b7683;
  --brand:#0f766e;--brand-ink:#fff;--brand-soft:#e3f4f1;--brand-text:#0f6a63;
  --ok:#15803d;--ok-soft:#e4f6ea;--warn:#a16207;--warn-soft:#fdf3d9;
  --bad:#c0342b;--bad-soft:#fdeae8;--info:#1d5fb4;--info-soft:#e6f0fc;
  --r:14px;--r2:10px;--gap:16px;--chart:#0d9488;
  --shadow:0 1px 2px rgba(22,32,44,.05),0 1px 3px rgba(22,32,44,.04);
  --shadow2:0 18px 50px rgba(15,25,35,.2);color-scheme:light;
}
[data-theme=dark]{
  --bg:#0d1317;--surface:#161e24;--surface2:#1c262d;--line:#26323a;--line2:#37454e;
  --ink:#e9eff2;--ink2:#a6b3bc;--ink3:#8a98a2;
  --brand:#2dd4bf;--brand-ink:#04211e;--brand-soft:#123532;--brand-text:#5eead4;
  --ok:#5ad08f;--ok-soft:#14322a;--warn:#e8b75c;--warn-soft:#382c13;
  --bad:#f28b82;--bad-soft:#3d2020;--info:#8ab8f5;--info-soft:#172b45;
  --chart:#11a899;--shadow:none;--shadow2:0 18px 50px rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
a{color:var(--brand-text)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--ink2)}.small{font-size:12.5px}.nowrap{white-space:nowrap}.right{text-align:right}.strong{font-weight:600}.mono{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px}.wrap-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.between{justify-content:space-between}
.stack{display:grid;gap:var(--gap);align-content:start;min-width:0}.mt{margin-top:var(--gap)}.mt2{margin-top:6px}

/* Kerangka */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;min-width:0;text-decoration:none;color:inherit}
.brand img{height:36px;width:auto;max-width:96px;object-fit:contain;flex:none;background:#fff;border-radius:8px;padding:2px 3px}
.brand b{display:block;font-size:14.5px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--ink3);font-size:12px;line-height:1.3}
.nav-h{font-size:12px;font-weight:600;color:var(--ink3);padding:18px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;min-height:40px;padding:8px 10px;border-radius:var(--r2);color:var(--ink2);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:600;padding:0 7px;line-height:19px}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:4px}
.me{display:flex;align-items:center;gap:10px;padding:6px;border-radius:var(--r2);text-decoration:none;color:inherit;min-width:0;flex:1}
.me:hover{background:var(--surface2)}
.me b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:22px 32px 14px}
.top-in{display:flex;align-items:center;gap:10px;width:100%;max-width:1240px;margin:0 auto}
.top h1{font-size:22px;font-weight:650;line-height:1.25;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--ink2);font-size:13px;line-height:1.35;margin-top:1px}
.page-act{display:flex;align-items:center;gap:8px;flex:none}
.content{padding:4px 32px 48px;width:100%;max-width:1304px;margin:0 auto}
.bnav{display:none}

/* Komponen */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:12px 20px}
.card>.hd h2{font-size:15px;font-weight:650;letter-spacing:-.005em}
.card>.bd{padding:4px 20px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:7px 14px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--surface);font-weight:550;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;transition:background .1s,border-color .1s}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08);background:var(--brand)}
.btn.wa{background:#128c4f;border-color:#128c4f;color:#fff}
.btn.wa:hover{background:#0f7a44}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line)}
.btn.icon{padding:0;width:38px}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px;border-radius:9px}.btn.sm.icon{width:32px;padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:550;line-height:18px;white-space:nowrap;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.tag.ok,.tag.warn,.tag.bad,.tag.info,.tag.brand{border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.info{background:var(--info-soft);color:var(--info)}
.tag.brand{background:var(--brand-soft);color:var(--brand-text)}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field>label,.lbl{font-size:13px;font-weight:550;color:var(--ink2)}
.req::after{content:" *";color:var(--bad)}
.hint{font-size:12px;color:var(--ink3);line-height:1.4}
.inp{width:100%;min-height:40px;padding:8px 12px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surface)}
textarea.inp{min-height:90px;resize:vertical;line-height:1.5}
.inp::placeholder{color:var(--ink3)}
.inp:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp[readonly]{background:var(--surface2);color:var(--ink2)}
input[type=file].inp{padding:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
/* Tata letak: kolom seimbang yang mengisi lebar halaman */
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:stretch}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);align-items:stretch}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.sticky{position:sticky;top:78px}
.form-act{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.foot-act{display:flex;justify-content:flex-end;gap:8px}
.seg{display:inline-flex;padding:3px;background:var(--line);border-radius:11px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;min-height:32px;padding:4px 13px;border-radius:8px;font-weight:550;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.jenis-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{display:block;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--brand)}
.opt b{display:block;font-weight:600}.opt small{color:var(--ink2);display:block;line-height:1.35;margin-top:1px}
.opt.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:var(--gap)}
.search{position:relative;flex:1 1 240px;min-width:0}
.search svg{position:absolute;left:12px;top:11px;color:var(--ink3)}
.search input{padding-left:38px}
.toolbar select.inp{width:auto;max-width:100%}

/* Tabel: jadi kartu di layar kecil */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:550;text-align:left;color:var(--ink3);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:20px}
.tbl th:last-child,.tbl td:last-child{padding-right:20px}
.tbl th.right,.tbl td.right{text-align:right}
.th-sort{display:inline-flex;align-items:center;gap:3px;border:0;background:none;padding:3px 5px;margin:-3px -5px;border-radius:6px;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.th-sort svg.i{width:14px;height:14px;opacity:.5}
.th-sort:hover{background:var(--surface2);color:var(--ink)}.th-sort:hover svg.i{opacity:1}
.th-sort.on{color:var(--brand-text);font-weight:650}.th-sort.on svg.i{opacity:1;stroke-width:2.4}
.th-pisah{margin:0 7px;opacity:.6}
.sort-m{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sort-m label{flex:none;font-size:12.5px;color:var(--ink3)}
.sort-m select{flex:1;min-width:0;width:auto}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface2)}
.tbl .who{display:flex;align-items:center;gap:11px;min-width:0}
.tbl td.acts .wrap-row{flex-wrap:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.empty{padding:40px 20px;text-align:center;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.stat{padding:18px 20px;text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px}
a.stat:hover{border-color:var(--line2)}
.stat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand-text)}
.stat .ic.warn{background:var(--warn-soft);color:var(--warn)}.stat .ic.bad{background:var(--bad-soft);color:var(--bad)}.stat .ic.ok{background:var(--ok-soft);color:var(--ok)}
.stat .n{font-size:23px;font-weight:650;line-height:1.2;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .l{color:var(--ink2);font-size:12.5px;line-height:1.35}
.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--gap);align-items:stretch;margin-top:var(--gap)}
.dash>.card{display:flex;flex-direction:column}
.dash>.card>.empty{margin:auto}
.dash.adm{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
/* Pendapatan */
.pend-filter{display:flex;gap:8px;flex-wrap:wrap}
.pend-filter select.inp{width:auto}
.pend-grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.4fr);gap:32px;align-items:stretch}
.pend-hero{display:grid;gap:18px;align-content:center}
.pend-hero .n{font-size:27px;font-weight:650;letter-spacing:-.015em;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pend-hero .l{color:var(--ink2);font-size:13px;margin-bottom:3px}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px}
.chart button{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;min-width:0;border-radius:6px;color:var(--ink3)}
.chart .plot{position:relative;height:150px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line2)}
.chart .b{width:min(70%,30px);min-height:2px;background:var(--chart);opacity:.45;border-radius:4px 4px 0 0;transition:opacity .1s}
.chart .b.nol{background:var(--line2);opacity:1;border-radius:0}
.chart button:hover .b:not(.nol),.chart button:focus-visible .b:not(.nol),.chart button.on .b:not(.nol){opacity:1}
.chart .lb{position:absolute;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.chart .tip{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(100% + 2px);background:#16202c;color:#fff;font-size:12px;line-height:1.35;padding:5px 9px;border-radius:7px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .08s}
.chart button:first-child .tip,.chart button:nth-child(2) .tip{left:0;transform:none}
.chart button:last-child .tip,.chart button:nth-last-child(2) .tip{left:auto;right:0;transform:none}
.chart button:hover .tip,.chart button:focus-visible .tip{opacity:1}
.chart .bl{font-size:11.5px;padding:6px 0 2px;text-align:center}
.chart button.on .bl{color:var(--brand-text);font-weight:650}
[data-theme=dark] .chart .tip{background:#e9eff2;color:#16202c}

.ringkas{list-style:none;margin:0;padding:0 20px 12px}
.ringkas li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.alert{display:flex;gap:10px;padding:11px 14px;border-radius:var(--r2);background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.45}
.alert.info{background:var(--info-soft);color:var(--info)}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert a{color:inherit;font-weight:600}
.kv{display:grid;grid-template-columns:128px minmax(0,1fr);gap:9px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;overflow-wrap:anywhere}
.twocol{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--gap);align-items:start}

/* Tahapan */
.steps{list-style:none;margin:0;padding:0}
.steps>li{position:relative;padding:0 0 22px 42px}
.steps>li:last-child{padding-bottom:0}
.steps>li::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.steps>li.done::before{background:var(--brand)}
.steps>li:last-child::before{display:none}
.dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:650;background:var(--surface2);color:var(--ink3);border:1px solid var(--line2)}
.dot svg.i{width:15px;height:15px;stroke-width:2.4}
.steps .done .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.steps .now .dot{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-text)}
.steps .t{font-weight:600;line-height:28px}
.steps .wait .t{color:var(--ink3)}
.steps .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.log{list-style:none;padding:0;margin:0;font-size:13px}
.log li{padding:9px 0;border-bottom:1px solid var(--line)}.log li:last-child{border:0}

.jenis-grup{display:grid;gap:7px}
#jenis-grid{display:grid;gap:14px}
.opt{position:relative}
.opt>svg.i{position:absolute;top:10px;right:10px;width:16px;height:16px;color:var(--brand-text);stroke-width:2.4}
/* Pilihan transportasi agen */
.pilih-trans .opt{display:grid;justify-items:center;text-align:center;gap:6px;padding:22px 16px 18px;border-width:1.5px;border-radius:14px;transition:border-color .1s,background .1s}
.pilih-trans .opt b{font-size:15.5px}
.pilih-trans .opt small{margin:0 0 6px}
.pt-ic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.pt-ic svg.i{width:30px;height:30px}
.pilih-trans .ya .pt-ic{background:var(--ok-soft);color:var(--ok)}
.pilih-trans .tidak .pt-ic{background:var(--warn-soft);color:var(--warn)}
.pilih-trans .ya:hover,.pilih-trans .ya:focus-visible{border-color:var(--ok);background:var(--ok-soft)}
.pilih-trans .tidak:hover,.pilih-trans .tidak:focus-visible{border-color:var(--warn);background:var(--warn-soft)}
.pilih-trans .ya:hover .pt-ic,.pilih-trans .tidak:hover .pt-ic{background:var(--surface)}
/* Pilih agen & petugas */
.combo{position:relative}
.combo-list{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:var(--shadow2);max-height:280px;overflow:auto}
.combo-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.combo-list button:hover,.combo-list button:focus{background:var(--surface2)}
.combo-list small{display:block;color:var(--ink3)}
.petugas-list{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:var(--r2);max-height:340px;overflow:auto}
.petugas-list button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:1px solid transparent;border-radius:10px;background:none;padding:8px 10px;cursor:pointer;transition:box-shadow .15s,background .15s,opacity .15s}
.petugas-list button:hover{background:var(--surface2)}
.petugas-list small{display:block;color:var(--ink3);line-height:1.35}
.petugas-list button.dipilih{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand),0 0 12px 1px color-mix(in srgb,var(--chart) 55%,transparent)}
.petugas-list button.dipilih .ava{background:var(--brand);color:var(--brand-ink)}
.petugas-list button.dipilih>svg.i{color:var(--brand-text)}
.petugas-list.penuh button:not(.dipilih){opacity:.55}
.perm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px;padding:6px 20px}
.perm-row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:54px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.switch{position:relative;width:40px;height:23px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:background .12s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .12s}
.switch input:checked+i{background:var(--brand)}
.switch input:checked+i::after{transform:translateX(17px)}
.switch input:focus-visible+i{outline:2px solid var(--brand);outline-offset:2px}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--gap)}
.hub-h{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 10px}
.hub+.hub-h{margin-top:22px}
.hub a{display:flex;gap:14px;padding:16px 18px;text-decoration:none;color:inherit;align-items:center}
.hub a:hover{border-color:var(--line2)}
.hub .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
.imgbox{display:flex;align-items:center;justify-content:center;background:#fff;border:1px dashed var(--line2);border-radius:var(--r2);padding:10px;min-height:84px}
.imgbox img{max-width:100%;max-height:110px}

/* Modal: lembar bawah di ponsel */
.scrim{position:fixed;inset:0;background:rgba(10,18,24,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:540px;max-height:calc(100dvh - 48px);display:flex;flex-direction:column;box-shadow:var(--shadow2)}
.modal.wide{max-width:900px}
.modal>.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 10px}
.modal>.mh h3{font-size:16px;font-weight:650;letter-spacing:-.005em}
.modal>.mb{padding:6px 20px 18px;overflow:auto;flex:1;overscroll-behavior:contain}
.modal>.mf{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.toasts{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:24px;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:#16202c;color:#fff;padding:11px 15px;border-radius:11px;box-shadow:var(--shadow2);font-size:13.5px}
.toast.bad{background:#a52a21}
[data-theme=dark] .toast:not(.bad){background:#e9eff2;color:#16202c}

/* Login */
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login-side{background:#0c4f4a;color:#eafaf7;padding:48px clamp(32px,6vw,88px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.login-side .lg{height:64px;max-width:200px;object-fit:contain;align-self:flex-start;background:#fff;border-radius:12px;padding:6px 10px}
.login-side h1{font-size:clamp(28px,3vw,38px);font-weight:650;line-height:1.15;letter-spacing:-.015em}
.login-side p{color:#c3e6e0;font-size:15px;line-height:1.55;max-width:44ch}
.login-wk{display:flex;flex-wrap:wrap;gap:7px;list-style:none;margin:0;padding:0}
.login-wk li{padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.1);font-size:12.5px;font-weight:500}
.login-main{display:grid;place-items:center;padding:32px 24px}
.login-form{width:100%;max-width:380px;display:grid;gap:16px}
.login-form h2{font-size:22px;font-weight:650;letter-spacing:-.01em}
.demo{margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}

/* Lembar surat: tetap putih di mode gelap */
.preview{background:#59625f;padding:14px;border-radius:var(--r2)}
.sheet-wrap{margin:0 auto 14px;overflow:hidden}
.sheet-wrap:last-child{margin-bottom:0}
.sheet{width:794px;height:1123px;background:#fff;color:#000;font:14.67px/1.15 Arial,Helvetica,sans-serif;position:relative;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.35);transform-origin:0 0}
.sheet .body{position:absolute;left:113.4px;width:585.9px}
.sheet p{margin:0;position:relative;min-height:1.15em;white-space:pre-wrap}
.sheet .seg-a{position:absolute;top:0;white-space:pre}
.sheet table{border-collapse:collapse;table-layout:fixed}
.sheet td{vertical-align:middle;padding:0 7px}
.sheet .kop{position:absolute;left:41px;top:38px;display:flex;font-family:"Segoe UI",Arial,sans-serif}
.sheet .kop-l{width:348px}.sheet .kop-l img{width:208px;display:block}
.sheet .kop-img{position:absolute;left:41px;top:38px;width:712px}
.kop .k1{color:#12b0a0;font-weight:700;font-size:20px;line-height:22.6px}
.kop .k2{color:#6b7472;font-weight:700;font-size:15.5px;line-height:16.7px}
.kop .k3{color:#6b7472;font-size:15.5px;line-height:20px}
.kop .k4{color:#6b7472;font-size:11.3px;line-height:16px;display:flex;gap:4px;align-items:center}
.kop .k4 img{width:11px;height:11px}.kop .k4 span{min-width:11px}
.sheet .pgno{position:absolute;left:0;right:0;top:49px;text-align:center}
.sheet .foot{position:absolute;font-size:12px;line-height:1.15;border:1px solid #000;padding:1px 10px;text-align:justify}

#kop-preview{max-height:300px;overflow:hidden;border-radius:0 0 13px 13px}
@media (max-width:1180px){
  .dash.adm{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash,.twocol,.split,.cols2{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
}
/* Invoice agen: yang perlu dilakukan di atas, rincian di samping atau dilipat */
.inv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.inv-aksi{grid-column:2;grid-row:1;display:grid;gap:12px;position:sticky;top:76px}
.inv-det{grid-column:1;grid-row:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.inv-det>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:10px 18px;font-weight:650;cursor:pointer;list-style:none}
.inv-det>summary::-webkit-details-marker{display:none}
.inv-det>summary svg.i{transition:transform .12s;transform:rotate(-90deg);color:var(--ink3)}
.inv-det[open]>summary svg.i{transform:rotate(90deg)}
.inv-det[open]>summary{border-bottom:1px solid var(--line)}
.inv-sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.inv-sum-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.card-bukti>.bd{gap:10px}

function mergeRec(b,l,r){
  const out={};
  for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
    if(k==='log'&&Array.isArray(l[k])&&Array.isArray(r[k])){
      const m=new Map();[...l[k],...r[k]].forEach(x=>m.set(x.t+'|'+x.msg,x));
      out[k]=[...m.values()].sort((x,y)=>y.t-x.t);continue;
    }
    const v=JSON.stringify(l[k])!==JSON.stringify(b[k])?l[k]:r[k];
    if(v!==undefined)out[k]=v;
  }
  return out;
}
function mergeList(b,l,r){
  const bm=new Map((b||[]).map(x=>[x.id,x])),lm=new Map(l.map(x=>[x.id,x])),rm=new Map(r.map(x=>[x.id,x])),out=[];

  l.forEach(x=>{if(!rm.has(x.id)&&!bm.has(x.id))out.push(x);});

}

  // Biaya dirinci per petugas dan tagihan terbit tanpa pengesahan

function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const head=text.split(/\r?\n/,1)[0];const sep=(head.match(/;/g)||[]).length>(head.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],c='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(c);c='';}

/* Pendapatan = tagihan berstatus valid, dihitung menurut tanggal transfer */
function periodeDash(){const n=today();if(!ui.dash)ui.dash={y:+n.slice(0,4),m:+n.slice(5,7)};return ui.dash;}
const stValid=l=>l.filter(s=>stage(s)==='valid'&&s.bayar&&s.bayar.tgl);
const jmlPeriode=(l,y,m1,m2)=>stValid(l).filter(s=>{const Y=+s.bayar.tgl.slice(0,4),M=+s.bayar.tgl.slice(5,7);return Y===y&&M>=m1&&M<=m2;}).reduce((a,s)=>a+totalTagihan(s.tagihan),0);
const BLN3=BULAN.map(b=>b.slice(0,3));
const ringkasRp=n=>n>=1e9?(n/1e9).toFixed(n%1e9?2:0).replace('.',',')+' M':n>=1e6?(n/1e6).toFixed(n%1e6?2:0).replace('.',',').replace(/,?0+$/,x=>x.includes(',')?'':x)+' jt':n>=1e3?Math.round(n/1e3)+' rb':String(n);
function kartuPendapatan(){
  const {y,m}=periodeDash(),now=+today().slice(0,4),tahunData=stValid(DB.st).map(s=>+s.bayar.tgl.slice(0,4));
  const dari=Math.min(now-1,y,...tahunData),sampai=Math.max(now,y,...tahunData),tahun=[];for(let t=sampai;t>=dari;t--)tahun.push(t);
  const bulanan=BULAN.map((_,i)=>jmlPeriode(DB.st,y,i+1,i+1)),maks=Math.max(...bulanan,1);
  const dipilih=bulanan[m-1],berjalan=bulanan.slice(0,m).reduce((a,b)=>a+b,0);
  const batang=bulanan.map((n,i)=>{const on=i+1===m,tg=n?Math.max(n/maks*118,3):0;
    return `<button type="button" class="${on?'on':''}" data-act="dashPilih" data-m="${i+1}" aria-pressed="${on}" aria-label="${BULAN[i]} ${y}: Rp ${rp(n)}"><span class="plot">${on&&n?`<span class="lb" style="bottom:${tg+4}px">${ringkasRp(n)}</span>`:''}<span class="b ${n?'':'nol'}" style="height:${n?tg+'px':'2px'}"></span><span class="tip">${BULAN[i]} ${y}<br><b>Rp ${rp(n)}</b></span></span><span class="bl">${BLN3[i]}</span></button>`;}).join('');
  return `<div class="card mt"><div class="hd" style="flex-wrap:wrap"><h2>Pendapatan</h2><div class="pend-filter">
    <select class="inp" data-change="dashBulan" aria-label="Bulan">${BULAN.map((b,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${b}</option>`).join('')}</select>
    <select class="inp" data-change="dashTahun" aria-label="Tahun">${tahun.map(t=>`<option ${t===y?'selected':''}>${t}</option>`).join('')}</select></div></div>
  <div class="bd"><div class="pend-grid"><div class="pend-hero">
    <div><div class="l">${BULAN[m-1]} ${y}</div><div class="n" id="pend-bulan">Rp ${rp(dipilih)}</div></div>
    <div><div class="l">Total berjalan ${m===1?`Januari ${y}`:`Januari s.d. ${BULAN[m-1]} ${y}`}</div><div class="n" id="pend-tahun">Rp ${rp(berjalan)}</div></div>
  </div><div class="chart" role="group" aria-label="Pendapatan per bulan tahun ${y}">${batang}</div></div></div></div>`;
}
function rekapWilker(){

const refresh=()=>{save();route();};
const actions={
  closeModal,
  salinTautan(el){salinKe(appLink('t/'+findST(el.dataset.id).token),'Tautan agen disalin');},
  salinTeks(el){salinKe(el.dataset.t,'Disalin');},
  async unduhFile(el){const f=await store.get('files',el.dataset.file);if(f)downloadBlob(f.blob,f.name);else toast('Berkas tidak ditemukan','bad');},
  async lihatBukti(el){
    const s=findST(el.dataset.id);if(!s||!s.bayar||!bolehLihat(s))return;
    const b=s.bayar,f=await store.get('files',b.fileId),k=stage(s),bisa=k==='validasi'&&can('validasi');
    const isi=!f?'<div class="empty">Berkas tidak ditemukan.</div>':/^image\//.test(f.type)?`<a href="${urlBerkas(f.blob)}" target="_blank" rel="noopener" title="Buka ukuran penuh"><img src="${urlBerkas(f.blob)}" alt="Bukti transfer"></a>`:/pdf$/.test(f.type)?`<iframe src="${urlBerkas(f.blob)}" title="Bukti transfer"></iframe>`:`<div class="empty">${esc(f.name)}</div>`;
    openModal({title:`Bukti Transfer - ${s.kapal}`,wide:true,body:`<div class="bukti-lay"><div class="bukti-view">${isi}</div><div class="bukti-info">${stageTag(s)}<dl class="kv"><dt>Agen</dt><dd>${esc(namaAgenST(s))}</dd>${baisBukti(b)}<dt>Jumlah tagihan</dt><dd class="strong mono">Rp ${rp(totalTagihan(s.tagihan))}</dd>${b.status==='ditolak'?`<dt>Alasan tolak</dt><dd>${esc(b.alasan)}</dd>`:''}${b.validBy?`<dt>Divalidasi</dt><dd>${esc(b.validBy)}, ${waktu(b.validAt)}</dd>`:''}</dl></div></div>`,
      foot:`${f?`<button class="btn bukti-unduh" aria-label="Unduh berkas" data-act="unduhFile" data-file="${b.fileId}">${ic('down')}<span class="desk">Unduh berkas</span></button>`:''}<button class="btn ${bisa?'bukti-tutup':''}" data-act="closeModal">Tutup</button>${bisa?`<button class="btn danger" data-act="tolakBayar" data-id="${s.id}">Tolak</button><button class="btn pri" data-act="validasi" data-id="${s.id}">${ic('check')} Pembayaran valid</button>`:''}`});
  },
  dashPilih(el){periodeDash().m=+el.dataset.m;rerender();},
  bankLain(){const i=$('#f_bank');i.dataset.lain='1';i.placeholder='Ketik nama bank Anda';$('#bank-list').hidden=true;i.focus();},
  pickBank(el){const i=$('#f_bank');i.value=el.dataset.n;$('#bank-list').hidden=true;const n=document.querySelector('[name=norek]');if(n&&innerWidth>860)n.focus();},
  demoLogin(el){doLogin(el.dataset.l,el.dataset.p);},
  logout(){sessionStorage.removeItem('rpl.session');ME=null;location.hash='';route();},
  toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');const b=$('[data-act=toggleTheme]');if(b)b.innerHTML=ic(document.documentElement.dataset.theme==='dark'?'sun':'moon');const h=location.hash;if(h.includes('akun'))route();},
  setTheme(el){applyTheme(el.dataset.v);route();},
  previewST(el){const s=findST(el.dataset.id);showPreview('Pratinjau Surat Tugas',docST(s),'st',s.id);},
  dlST(el){downloadST(findST(el.dataset.id));},
  dlNominatif(el){const s=findST(el.dataset.id);if(s&&s.tagihan&&bolehLihat(s))unduhNominatif(s);},
  previewNominatif(el){const s=findST(el.dataset.id);if(!s||!s.tagihan||!bolehLihat(s))return;
    actions._previewDl=()=>unduhNominatif(s);
    openModal({title:`Daftar Nominatif - ${s.kapal}`,wide:true,body:`<div class="bukti-view"><iframe src="${urlBerkas(pdfNominatif(s))}" title="Daftar nominatif"></iframe></div>`,foot:`<button class="btn" data-act="closeModal">Tutup</button><button class="btn pri" data-act="_previewDl">${ic('down')} Unduh PDF</button>`});},
  openFile(el){openFile(el.dataset.file);},
  sort(el){const{t,c:k}=el.dataset,s=sortAktif(t),awal=SORT_KOL[t][k][2]||1;
    if(!s||s.c!==k)sortPilih[t]={c:k,d:awal};else if(s.d===awal)sortPilih[t]={c:k,d:-awal};else delete sortPilih[t];
    sortSimpan(t);document.querySelector(`.th-sort[data-t="${t}"][data-c="${k}"]`)?.focus({preventScroll:true});},
  sortArah(el){const t=el.dataset.t,s=sortAktif(t);if(s){sortPilih[t]={c:s.c,d:-s.d};sortSimpan(t);}},
  suratPage(el){ui.surat.page=+el.dataset.p;renderSuratList();},
  setoranPage(el){ui.setoran.page=+el.dataset.p;renderSetoranList();},
  agenPage(el){ui.agen.page=+el.dataset.p;renderAgenList();},
  setJenis(el){const k=el.dataset.k,ada=formJenis.includes(k);
    formJenis=urutJenis(ada?formJenis.filter(x=>x!==k):[...formJenis,k]);
    const bawaan=CONTOH[kunciJenis(formJenis)];if(bawaan&&!ui.pick.length)formOrang=bawaan;
    const y=scrollY;$('#jenis-grid').innerHTML=jenisButtons();$('#orang-seg').innerHTML=orangButtons();$('#format-hint').textContent=formatHint();$('#jenis-count').textContent=formJenis.length?`${formJenis.length} dipilih`:'Belum dipilih';
    // Hal hanya diganti selama petugas belum mengubahnya sendiri
    const hal=$('form[data-form=surat]').elements.hal;if(!hal.value.trim()||hal.value===halOtomatis)hal.value=halDari(formJenis);halOtomatis=halDari(formJenis);
    scrollTo(0,y);renderPicker();},
  setOrang(el){formOrang=+el.dataset.n;$('#orang-seg').innerHTML=orangButtons();$('#format-hint').textContent=formatHint();ui.pick=ui.pick.slice(0,formOrang);renderPicker();},

    box.innerHTML=(cocok.map(barisBank).join('')||'<div class="empty small" style="padding:14px">Bank tidak ada di daftar.</div>')+barisBankLain();
    box.hidden=false;
  },
  suratQ(e){ui.surat.q=e.target.value;ui.surat.page=1;deb(renderSuratList);},
  setoranQ(e){ui.setoran.q=e.target.value;ui.setoran.page=1;deb(renderSetoranList);},
  agenQ(e){ui.agen.q=e.target.value;ui.agen.page=1;deb(renderAgenList);},
  usersQ(e){ui.users.q=e.target.value;deb(renderUserList);},
  petugasCari(e){ui.petugas.q=e.target.value;deb(renderPetugasList);},
  petugasQ(){deb(renderPicker);},
  agenCombo(e){
    const q=e.target.value.toLowerCase().trim(),box=$('#agen-list'),f=$('form[data-form=surat]');f.elements.agenId.value='';
    if(!q){box.hidden=true;return;}
    const m=DB.agen.filter(a=>a.aktif&&(a.nama+' '+a.kab+' '+a.email).toLowerCase().includes(q)).sort((x,y)=>skorAgen(y)-skorAgen(x)).slice(0,30);
    box.innerHTML=m.map(a=>`<button type="button" data-act="pickAgen" data-id="${a.id}"><span class="strong">${esc(a.nama)}</span><small>${esc(a.kab)}, ${esc(a.email)}</small></button>`).join('')||'<div class="empty small">Agen tidak ditemukan</div>';
    box.hidden=false;
  }
};
async function imgSetting(e,maxW,apply){
  const file=e.target.files[0];if(!file)return;
  if(file.size>8*1024*1024)return toast('Gambar melebihi 8 MB','bad');
  try{apply(await fileToImage(file,maxW));refresh();toast('Gambar disimpan');}catch(err){toast(err.message,'bad');}
}
const changes={
  tagihanJarak(e){const j=e.target.value,b=biayaJarak(j),f=e.target.form;
    f.querySelectorAll('[name^=tr_]').forEach(i=>{i.value=j==='jauh'?0:b.transport||'';i.readOnly=j==='jauh';});
    f.querySelectorAll('[name^=uh_]').forEach(i=>{i.value=b.uangHarian;});
    $('#jarak-hint').textContent=hintJarak(j);},
  sortKol(e){const t=e.target.dataset.t,k=e.target.value;if(k)sortPilih[t]={c:k,d:SORT_KOL[t][k][2]||1};else delete sortPilih[t];sortSimpan(t);},
  dashBulan(e){periodeDash().m=+e.target.value;rerender();},
  dashTahun(e){periodeDash().y=+e.target.value;rerender();},
  buktiPilih(e){
    const f=e.target.files[0],box=$('#drop-isi');if(!box)return;
    if(!f){box.innerHTML=isiDrop();return;}
    const ukuran=(f.size/1048576).toFixed(f.size<1048576?2:1)+' MB';
    box.innerHTML=(/^image\//.test(f.type)?`<img src="${urlBerkas(f)}" alt="">`:`<span class="drop-ic">${ic('file')}</span>`)+`<span class="grow"><b class="strong" style="overflow-wrap:anywhere">${esc(f.name)}</b><span class="small muted" style="display:block">${ukuran}, ketuk untuk mengganti</span></span>`;
  },
  petugasWilker(e){ui.petugas.wilker=e.target.value;renderPetugasList();},
  userRole(e){const w=$('#wk-field');if(w)w.hidden=e.target.value==='admin';},
  suratJenis(e){ui.surat.jenis=e.target.value;ui.surat.page=1;renderSuratList();},
  suratWilker(e){ui.surat.wilker=e.target.value;ui.surat.page=1;renderSuratList();},
  setoranWilker(e){ui.setoran.wilker=e.target.value;ui.setoran.page=1;renderSetoranList();},
  setoranStatus(e){ui.setoran.status=e.target.value;ui.setoran.page=1;renderSetoranList();},
  agenKab(e){ui.agen.kab=e.target.value;ui.agen.page=1;renderAgenList();},
  perm(e){DB.settings.perms[e.target.dataset.k]=e.target.checked;save();},
  kopLogo(e){imgSetting(e,1040,v=>DB.settings.kop.logo=v);},
  kopGambar(e){imgSetting(e,2000,v=>DB.settings.kop.gambar=v);},
  appLogo(e){imgSetting(e,500,v=>DB.settings.appLogo=v);},
  async agenImport(e){
    const file=e.target.files[0];if(!file)return;
    const rows=parseCSV(await file.text());if(rows.length<2)return toast('Berkas CSV kosong','bad');
    const head=rows[0].map(h=>h.trim().toLowerCase());
    const col=(...n)=>head.findIndex(h=>n.some(x=>h.includes(x)));
    const c={nama:col('nama','perusahaan'),siup:col('siup'),email:col('email'),telp:col('telepon','telp','hp'),alamat:col('alamat'),provinsi:col('provinsi'),kab:col('kabupaten','kota'),ket:col('keterangan')};
    if(c.nama<0||c.email<0)return toast('CSV harus memiliki kolom nama dan email','bad');
    let add=0,upd=0,skip=0;
    rows.slice(1).forEach(r=>{const g=k=>c[k]>=0?String(r[c[k]]||'').trim():'';const email=g('email'),nama=g('nama');if(!email||!nama){skip++;return;}
      const d={nama,email};['siup','telp','alamat','provinsi','kab','ket'].forEach(k=>{if(g(k))d[k]=g(k);});
      const a=DB.agen.find(x=>x.email.toLowerCase()===email.toLowerCase());
      if(a){Object.assign(a,d);upd++;}else{DB.agen.unshift({id:'ag'+uid(),siup:'',telp:'',alamat:'',provinsi:'',kab:'',ket:'',tgl:today(),aktif:true,...d});add++;}});
    refresh();toast(`Impor selesai: ${add} baru, ${upd} diperbarui, ${skip} dilewati`);
  },
  async restore(e){
    const file=e.target.files[0];if(!file)return;
    let data;try{data=JSON.parse(await file.text());}catch(err){return toast('Berkas cadangan tidak valid','bad');}
    if(!data.db||!data.db.settings||!Array.isArray(data.db.st))return toast('Berkas cadangan tidak valid','bad');
    confirmBox('Pulihkan cadangan','Seluruh data saat ini akan diganti dengan isi cadangan.',async()=>{
      for(const k of await store.keys('files'))await store.del('files',k);
      for(const[k,f]of Object.entries(data.files||{})){const b=await (await fetch(f.data)).blob();await store.put('files',k,{name:f.name,type:f.type,blob:b});}
      DB=data.db;migrasi(DB);await flush(true);await bersihMigrasi();sessionStorage.removeItem('rpl.session');ME=null;location.hash='';route();toast('Cadangan dipulihkan');
    },'Pulihkan',true);
  }
};

/* ================= Pemasang kejadian ================= */
const TEKAN='.th-sort,.btn,.opt,.seg button,.nav a,.bnav a,a.stat,.petugas-list button,.combo-list button,.bukti-thumb,.drop';
let riakPos=null;
function riak(el,[x,y]){el.style.setProperty('--rx',x+'px');el.style.setProperty('--ry',y+'px');el.classList.remove('riak');void el.offsetWidth;el.classList.add('riak');clearTimeout(el._riak);el._riak=setTimeout(()=>el.classList.remove('riak'),480);}
document.addEventListener('pointerdown',e=>{const el=e.target.closest(TEKAN);if(!el||el.disabled)return;const r=el.getBoundingClientRect();riakPos=[e.clientX-r.left,e.clientY-r.top];riak(el,riakPos);},{passive:true});
document.addEventListener('touchstart',()=>{},{passive:true});
document.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  if(act){
    if(act.disabled)return;
    const fn=actions[act.dataset.act];
    if(fn){const kunci=[...act.attributes].filter(a=>a.name.startsWith('data-')).map(a=>`[${a.name}="${CSS.escape(a.value)}"]`).join('');const keepDefault=fn(act,e);if(!act.isConnected&&riakPos){const b=document.querySelector(kunci);if(b&&b.matches(TEKAN))riak(b,riakPos);}riakPos=null;if(keepDefault!==true)e.preventDefault();e.stopPropagation();return;}
  }
  const scrim=e.target.closest('[data-scrim]');if(scrim&&e.target===scrim){closeModal();return;}
  const go=e.target.closest('[data-go]');if(go&&!e.target.closest('a,button,input,label')){location.hash='#/'+go.dataset.go;return;}
  if(!e.target.closest('.combo'))document.querySelectorAll('.combo-list').forEach(b=>b.hidden=true);
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.busy)return;f.dataset.busy=1;
  try{await forms[f.dataset.form](new FormData(f),f);}catch(err){toast('Terjadi kesalahan: '+err.message,'bad');}
  delete f.dataset.busy;
});
for(const ev of ['dragenter','dragover'])document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over');}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('.drop');if(!d)return;e.preventDefault();d.classList.remove('over');const i=d.querySelector('input');i.files=e.dataTransfer.files;i.dispatchEvent(new Event('change',{bubbles:true}));});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.input;if(k&&inputs[k])inputs[k](e);});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.change;if(k&&changes[k]){changes[k](e);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen)closeModal();});
for(const ev of ['focusin','focusout','click'])document.addEventListener(ev,e=>{if(e.target.dataset&&e.target.dataset.input==='bankCombo')inputs.bankCombo(e);});
addEventListener('hashchange',route);
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('inv-det'))ui.invBuka=e.target.open;},true);
/* Perubahan dari tab lain masuk tanpa muat ulang: lewat BroadcastChannel, saat tab difokuskan, dan pemeriksaan berkala */
let needRender=false,syncing=false;
const sibuk=()=>modalOpen||!!$('#app form[data-form]')||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
function rerender(){const y=scrollY;route();scrollTo(0,y);}
function umumkan(lama,baru){
  if(!ME)return;
  const dulu=new Map(lama.st.map(s=>[s.id,s]));
  baru.st.forEach(s=>{const o=dulu.get(s.id);if(!o||!bolehLihat(s))return;
    if(s.jemput&&!o.jemput)toast(`${s.kapal}: ${jemputTeks(s)}`);
    if(stage(s)==='validasi'&&stage(o)!=='validasi')toast(`${s.kapal}: agen mengunggah bukti bayar`);
  });
}
window.afterMerge=()=>{loadSession();if(sibuk())needRender=true;else rerender();};
async function syncNow(){
  if(!store.db||saveT||modalOpen||syncing)return;
  syncing=true;
  try{
    const rev=await store.get('kv','rev');
    if(rev!==undefined&&rev!==DB.rev){
      const baru=await store.get('kv','state');
      if(baru&&!saveT&&!modalOpen){const lama=DB;DB=baru;BASE=JSON.stringify(DB);loadSession();umumkan(lama,DB);needRender=true;}
    }
    if(needRender&&!sibuk()){needRender=false;rerender();}
  }finally{syncing=false;}
}
if(chan)chan.onmessage=syncNow;
addEventListener('focus',syncNow);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow();});
addEventListener('pagehide',()=>{if(saveT)flush();});
(async function boot(){
  await store.open();
  DB=await store.get('kv','state');
  if(!DB||!DB.settings){DB=seedState();await flush(true);}
  else if(migrasi(DB)){await flush(true);await bersihMigrasi();}
  BASE=JSON.stringify(DB);
  loadSession();route();
  setInterval(syncNow,2000);
  if(!store.db)toast('Penyimpanan browser tidak tersedia. Data hilang saat halaman ditutup.','bad');
})();
</script>
